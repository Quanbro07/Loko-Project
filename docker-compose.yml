include:
  - docker-compose-dev.yml

# Moi bien ${...} duoi day duoc doc tu file .env o thu muc goc.
# Copy .env.example -> .env va dien gia tri truoc khi chay `docker compose up`.
services:

  db:
    container_name: postgres
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chua duoc set - xem .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-loko_project}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5332:5432"
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: loko-project-app
    depends_on:
      - db
      - redis
      - ai-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-loko_project}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chua duoc set - xem .env.example}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_PROFILE_PRODUCT: product

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET chua duoc set - xem .env.example}
    env_file:
      - Backend/.env
    volumes:
      - ./data/uploads:/app/uploads/trip-pdf
    ports:
      - "8080:8080"
    networks:
      - app-network

  ai-service:
    build:
      context: ./AI-Service
      dockerfile: Dockerfile
    container_name: loko-project-ai-service
    # Cac API key (Gemini / Geoapify / Weather / SERP) duoc nap tu day.
    env_file:
      - AI-Service/.env
    ports:
      - "8000:8000"
    networks:
      - app-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: loko-project-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - app-network
    volumes:
      - ./Frontend/src:/app/src        # Map thu muc src may that vao src container
      - ./Frontend/public:/app/public  # Map thu muc public (neu can)
      - /app/node_modules              # Giu nguyen thu vien cua container, khong cho may that ghi de
    environment:
      - WATCHPACK_POLLING=true

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
    external: true
    name: loko-project_db_data
