services:
  redis:
    container_name: redis_container
    image: 'redis:latest'
    ports:
      # Doi REDIS_PORT trong .env neu cong 6379 da bi stack khac chiem
      - '${REDIS_PORT:-6379}:6379'
    networks:
      - app-network
    volumes:
      - redis_data:/data

# Định nghĩa mạng gốc ở đây
networks:
  app-network:
    driver: bridge

volumes:
  redis_data: