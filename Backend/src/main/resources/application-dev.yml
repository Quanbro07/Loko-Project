spring:
  application:
    name: Backend

  datasource:
    url: jdbc:postgresql://localhost:5432/loko_project
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      type: redis

  docker:
    compose:
      file: ../docker-compose-dev.yml
      lifecycle-management: start-and-stop

python:
  api:
    base-url: http://localhost:8000

file:
  upload-dir: uploads/trip-pdf/
