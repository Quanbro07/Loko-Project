server:
  port: 8080

jwt:
  # Khoa ky JWT (HS512, base64). Bat buoc truyen qua bien moi truong - xem .env.example
  secret: ${JWT_SECRET}

spring:
  application:
    name: loko-backend
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  profiles:
    active: product

python:
  api:
    version-url: /api/v1
    get-location-url: /locations/sync-locations
    make-plan-url: /schedule/generate
    regenerate-plan-url: /schedule/regenerate
    route-url: /routing/generate
    forecast-url: /weather/forecast
    base-url: http://localhost:8000
