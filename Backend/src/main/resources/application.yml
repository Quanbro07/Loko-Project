server:
  port: 8080

spring:
  application:
    name: loko-backend
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  profiles:
    active: dev

python:
  api:
    version-url: /api/v1
    get-location-url: /locations/sync-locations
    make-plan-url: /schedule/generate
    regenerate-plan-url: /schedule/regenerate
    route-url: /routing/generate
    forecast-url: /weather/forecast
    base-url: http://localhost:8000