spring:
  application:
    name: Backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}

  docker:
    compose:
      enabled: false

python:
  api:
    base-url: http://host.docker.internal:8000
    version-url: /api/v1
    get-location-url: /locations/sync-locations
    make-plan-url: /schedule/generate
    regenerate-plan-url: /schedule/generate
    route-url: /schedule/route